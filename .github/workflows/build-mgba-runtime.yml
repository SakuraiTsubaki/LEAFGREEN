name: Build mGBA runtime bundle
on:
  push:
    branches: [test-mgba-runtime]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install mGBA 0.10.5
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y mgba-sdl libmgba0.10t64 mgba-common libinih1
          /usr/games/mgba --version || true
      - name: Collect runtime
        run: |
          mkdir -p artifact/lib artifact/share
          cp /usr/games/mgba artifact/
          cp -a /usr/lib/x86_64-linux-gnu/libmgba.so.0.10* artifact/lib/
          cp -L /lib/x86_64-linux-gnu/libinih.so.1 artifact/lib/libinih.so.1
          if [ -d /usr/share/mgba ]; then cp -a /usr/share/mgba artifact/share/; fi
          ldd /usr/games/mgba > artifact/ldd.txt
          /usr/games/mgba --version > artifact/version.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-runtime-trixie
          path: artifact/
          retention-days: 1
